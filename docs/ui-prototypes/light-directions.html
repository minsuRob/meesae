<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f3f2ef" />
<title>meesae 라이트 디자인 방향 4종</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&display=swap" />
<style>
  /* ── 페이지 (시안 바깥) ─────────────────────────────────────── */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f3f2ef; color: #2a2a2a; font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 14px 20px; font-size: 13px; color: #666; flex-wrap: wrap; border-bottom: 1px solid #e3e1dc; background: #fff; }
  .bar a { color: #222; background: #fff; border: 1px solid #d8d6d0; border-radius: 999px; padding: 5px 12px; text-decoration: none; }
  .bar a.on { background: #111; color: #fff; border-color: #111; }
  .cols { display: flex; gap: 28px; padding: 20px; overflow-x: auto; align-items: flex-start; }
  .col { flex: 0 0 375px; display: grid; gap: 14px; }
  .col h2 { font-size: 16px; margin: 0; }
  .col .desc { font-size: 12.5px; line-height: 18px; color: #666; margin: 0 0 4px; min-height: 72px; }
  .col .desc b { color: #222; }

  /* ── 폰 프레임 공통 뼈대 (모양은 전부 변형별 변수) ──────────── */
  .frame { width: 375px; height: 812px; border-radius: 36px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink);
    font-size: 16px; line-height: 1.5; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 12px 32px rgba(40,36,30,.10); touch-action: manipulation; --tabH: 76px; }
  .frame button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .frame button:focus-visible, .frame [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .frame .num { font-variant-numeric: tabular-nums; }
  .frame h1, .frame h2, .frame h3 { margin: 0; text-wrap: balance; }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; background: var(--s2); }
  .scroll { position: absolute; inset: 0 0 var(--tabH, 76px) 0; overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .status { height: 44px; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tabH, 76px); display: flex; padding: 8px 0 18px; background: var(--tabBg); border-top: 1px solid var(--tabLine); }
  .tab { flex: 1; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--mute); min-height: 44px; }
  .tab.on { color: var(--tabOn); }
  .tab svg { width: 24px; height: 24px; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; width: 20px; height: 20px; flex: 0 0 auto; }
  .ic { width: 20px; height: 20px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ════════════════════════════════════════════════════════════════
     PIN · Pinterest 형 (design-md/pinterest)
     크림 중립 + 빨강 1색, radius 16 통일, 그림자 없음, 메이슨리 8px
     ════════════════════════════════════════════════════════════════ */
  [data-v=pin] { --bg:#fbfbf9; --s1:#ffffff; --s2:#f6f6f3; --s3:#e5e5e0; --ink:#000; --body:#33332e; --mute:#62625b; --ash:#91918c;
    --line:#dadad3; --primary:#e60023; --primaryDown:#cc001f; --focus:#435ee5; --tabBg:#fff; --tabLine:#dadad3; --tabOn:#e60023; --r:16px; }
  [data-v=pin] .hdr { padding: 6px 16px 10px; background: var(--s1); }
  [data-v=pin] .logo { font-weight: 800; font-size: 24px; letter-spacing: -1.2px; color: var(--primary); }
  [data-v=pin] .search { margin-top: 12px; height: 48px; border-radius: 9999px; background: var(--s2); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--ash); font-size: 16px; }
  [data-v=pin] .chips { display: flex; gap: 8px; padding: 12px 16px 4px; overflow-x: auto; scrollbar-width: none; }
  [data-v=pin] .chip { flex: 0 0 auto; height: 40px; padding: 0 16px; border-radius: 9999px; background: var(--s2); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; }
  [data-v=pin] .chip.on { background: var(--ink); color: #fff; }
  [data-v=pin] .masonry { columns: 2; column-gap: 8px; padding: 8px 8px 24px; }
  [data-v=pin] .pin { break-inside: avoid; margin-bottom: 8px; border-radius: var(--r); overflow: hidden; position: relative; background: var(--s2); }
  [data-v=pin] .pin .ov { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; }
  [data-v=pin] .pill { background: #fff; color: #000; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 9999px; display: inline-flex; gap: 4px; align-items: center; line-height: 1.2; }
  [data-v=pin] .pill .vv { width: 12px; height: 12px; stroke-width: 3; }
  [data-v=pin] .pin .likebtn { width: 40px; height: 40px; padding: 0; justify-content: center; }
  [data-v=pin] .pin .likebtn svg { width: 18px; height: 18px; stroke-width: 2; }
  [data-v=pin] .pin .likebtn:active { background: var(--s3); }
  [data-v=pin] .pin .meta { position: absolute; left: 10px; top: 10px; }
  [data-v=pin] .pin .meta .pill { padding: 5px 10px; font-size: 11px; }
  /* 대화방 */
  [data-v=pin] .chdr { display: flex; align-items: center; gap: 12px; padding: 4px 12px 10px; background: var(--s1); border-bottom: 1px solid var(--line); }
  [data-v=pin] .iconbtn { width: 40px; height: 40px; border-radius: 9999px; background: var(--s2); display: grid; place-items: center; }
  [data-v=pin] .av { width: 36px; height: 36px; border-radius: 9999px; overflow: hidden; }
  [data-v=pin] .msgs { padding: 16px 12px; display: grid; gap: 6px; }
  [data-v=pin] .day { justify-self: center; font-size: 12px; font-weight: 500; color: var(--mute); margin: 8px 0; }
  [data-v=pin] .bub { max-width: 78%; padding: 10px 14px; border-radius: var(--r); font-size: 15px; line-height: 1.4; }
  [data-v=pin] .bub.them { background: var(--s2); color: var(--body); justify-self: start; }
  [data-v=pin] .bub.me { background: var(--ink); color: #fff; justify-self: end; }
  [data-v=pin] .inbar { position: absolute; left: 0; right: 0; bottom: var(--tabH); padding: 10px 12px; background: var(--s1); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  [data-v=pin] .inbar .in { flex: 1; height: 48px; border-radius: 9999px; background: var(--s2); color: var(--ash); padding: 0 16px; display: flex; align-items: center; }
  [data-v=pin] .inbar .send { width: 40px; height: 40px; border-radius: 9999px; background: var(--primary); color: #fff; display: grid; place-items: center; }
  /* 포인트·설정 */
  [data-v=pin] .page { padding: 4px 16px 24px; display: grid; gap: 24px; }
  [data-v=pin] .h1 { font-size: 28px; font-weight: 700; letter-spacing: -1.2px; line-height: 1.2; }
  [data-v=pin] .feature { background: var(--s2); border-radius: var(--r); padding: 24px; }
  [data-v=pin] .feature .big { font-size: 44px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.15; }
  [data-v=pin] .feature .sub { color: var(--mute); font-size: 14px; margin-top: 6px; }
  [data-v=pin] .h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  [data-v=pin] .lrow { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  [data-v=pin] .lrow:last-child { border-bottom: 0; }
  [data-v=pin] .lrow .t { flex: 1; } [data-v=pin] .lrow .t b { display: block; font-size: 16px; font-weight: 600; } [data-v=pin] .lrow .t small { color: var(--mute); font-size: 14px; }
  [data-v=pin] .btn { height: 40px; padding: 0 14px; border-radius: 16px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  [data-v=pin] .btn.p { background: var(--primary); color: #fff; } [data-v=pin] .btn.p:active { background: var(--primaryDown); }
  [data-v=pin] .btn.s { background: var(--s3); color: #000; } [data-v=pin] .btn.s:active { background: #c8c8c1; }
  [data-v=pin] .btn.dis { background: var(--s2); color: var(--ash); }
  [data-v=pin] .price { font-size: 14px; font-weight: 700; }

  /* ════════════════════════════════════════════════════════════════
     AIR · Airbnb 형 (design-md/airbnb)
     흰 캔버스 + 잉크 #222 + Rausch 1색(CTA·하트), 카드 14 / 버튼 8 / 알약, 그림자 1단계만
     ════════════════════════════════════════════════════════════════ */
  [data-v=air] { --bg:#fff; --s1:#fff; --s2:#f7f7f7; --s3:#f2f2f2; --ink:#222; --body:#3f3f3f; --mute:#6a6a6a; --line:#ddd; --lineSoft:#ebebeb;
    --primary:#ff385c; --primaryDown:#e00b41; --focus:#222; --tabBg:#fff; --tabLine:#ebebeb; --tabOn:#ff385c;
    --shadow: rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.10) 0 4px 8px 0; }
  [data-v=air] .hdr { padding: 6px 16px 0; }
  [data-v=air] .search { height: 56px; border-radius: 9999px; background: #fff; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; padding: 0 8px 0 18px; }
  [data-v=air] .search .t { flex: 1; } [data-v=air] .search .t b { display: block; font-size: 14px; font-weight: 600; } [data-v=air] .search .t small { font-size: 12px; color: var(--mute); }
  [data-v=air] .orb { width: 40px; height: 40px; border-radius: 9999px; background: var(--s3); display: grid; place-items: center; }
  [data-v=air] .ptabs { display: flex; gap: 20px; padding: 18px 16px 0; border-bottom: 1px solid var(--lineSoft); margin: 0 0 16px; }
  [data-v=air] .ptab { padding: 0 2px 12px; font-size: 14px; font-weight: 500; color: var(--mute); border-bottom: 2px solid transparent; }
  [data-v=air] .ptab.on { color: var(--ink); border-color: var(--ink); font-weight: 600; }
  [data-v=air] .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 16px; padding: 0 16px 24px; }
  [data-v=air] .card .ph { aspect-ratio: 4/5; border-radius: 14px; overflow: hidden; position: relative; }
  [data-v=air] .card .heart { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; display: grid; place-items: center; color: #fff; }
  [data-v=air] .card .heart svg { width: 24px; height: 24px; fill: rgba(0,0,0,.5); stroke: #fff; stroke-width: 2; }
  [data-v=air] .card .badge { position: absolute; top: 10px; left: 10px; background: #fff; border-radius: 9999px; padding: 4px 10px; font-size: 11px; font-weight: 600; color: var(--ink); }
  [data-v=air] .card .cap { padding-top: 10px; }
  [data-v=air] .card .cap b { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  [data-v=air] .card .cap b span { font-size: 14px; font-weight: 400; display: inline-flex; gap: 3px; align-items: center; }
  [data-v=air] .card .cap small { display: block; color: var(--mute); font-size: 14px; line-height: 1.43; }
  [data-v=air] .card .cap em { font-style: normal; font-size: 14px; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  /* 대화방 */
  [data-v=air] .chdr { display: flex; align-items: center; gap: 12px; padding: 4px 16px 12px; border-bottom: 1px solid var(--lineSoft); }
  [data-v=air] .iconbtn { width: 40px; height: 40px; border-radius: 9999px; display: grid; place-items: center; }
  [data-v=air] .av { width: 40px; height: 40px; border-radius: 9999px; overflow: hidden; }
  [data-v=air] .msgs { padding: 20px 16px; display: grid; gap: 8px; }
  [data-v=air] .day { justify-self: center; font-size: 12px; color: var(--mute); margin: 4px 0 8px; }
  [data-v=air] .bub { max-width: 78%; padding: 12px 16px; border-radius: 20px; font-size: 16px; line-height: 1.4; }
  [data-v=air] .bub.them { background: var(--s2); color: var(--ink); justify-self: start; border-bottom-left-radius: 8px; }
  [data-v=air] .bub.me { background: var(--ink); color: #fff; justify-self: end; border-bottom-right-radius: 8px; }
  [data-v=air] .inbar { position: absolute; left: 0; right: 0; bottom: var(--tabH); padding: 12px 16px; background: #fff; border-top: 1px solid var(--lineSoft); display: flex; gap: 10px; align-items: center; }
  [data-v=air] .inbar .in { flex: 1; height: 48px; border-radius: 8px; border: 1px solid var(--line); color: var(--mute); padding: 0 14px; display: flex; align-items: center; }
  [data-v=air] .inbar .send { height: 48px; padding: 0 18px; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 500; }
  /* 포인트·설정 */
  [data-v=air] .page { padding: 4px 16px 24px; display: grid; gap: 28px; }
  [data-v=air] .h1 { font-size: 28px; font-weight: 700; line-height: 1.3; }
  [data-v=air] .feature { border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  [data-v=air] .feature .big { font-size: 40px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
  [data-v=air] .feature .sub { color: var(--mute); font-size: 14px; margin-top: 8px; }
  [data-v=air] .h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.18px; margin-bottom: 4px; }
  [data-v=air] .lrow { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--lineSoft); }
  [data-v=air] .lrow:last-child { border-bottom: 0; }
  [data-v=air] .lrow .t { flex: 1; } [data-v=air] .lrow .t b { display: block; font-size: 16px; font-weight: 500; } [data-v=air] .lrow .t small { color: var(--mute); font-size: 14px; }
  [data-v=air] .btn { height: 40px; padding: 0 16px; border-radius: 8px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; }
  [data-v=air] .btn.p { background: var(--primary); color: #fff; } [data-v=air] .btn.p:active { background: var(--primaryDown); }
  [data-v=air] .btn.s { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
  [data-v=air] .btn.dis { background: #ffd1da; color: #fff; }
  [data-v=air] .price { font-size: 16px; font-weight: 500; }
  [data-v=air] .big-cta { height: 48px; border-radius: 8px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 500; width: 100%; }

  /* ════════════════════════════════════════════════════════════════
     APL · Apple HIG 형 (design-md/apple)
     양피지 #f5f5f7 + 흰 그룹 카드 18, 상호작용은 파랑 1색, 17px 본문, pill CTA, 그림자 없음
     ════════════════════════════════════════════════════════════════ */
  [data-v=apl] { --bg:#f5f5f7; --s1:#fff; --s2:#f5f5f7; --s3:rgba(210,210,215,.64); --ink:#1d1d1f; --body:#1d1d1f; --mute:#6e6e73; --mute2:#86868b; --line:rgba(0,0,0,.08);
    --primary:#0066cc; --primaryDown:#0055aa; --focus:#0071e3; --tabBg:rgba(245,245,247,.86); --tabLine:rgba(0,0,0,.08); --tabOn:#0066cc; letter-spacing: -0.374px; }
  [data-v=apl] .tabbar { backdrop-filter: saturate(180%) blur(20px); }
  [data-v=apl] .hdr { padding: 0 20px 8px; }
  [data-v=apl] .large { font-size: 34px; font-weight: 600; letter-spacing: -0.374px; line-height: 1.2; padding-top: 4px; }
  [data-v=apl] .chips { display: flex; gap: 8px; padding: 12px 20px 4px; overflow-x: auto; scrollbar-width: none; }
  [data-v=apl] .chip { flex: 0 0 auto; height: 40px; padding: 0 16px; border-radius: 9999px; background: #fff; font-size: 14px; display: inline-flex; align-items: center; border: 1px solid transparent; letter-spacing: -0.224px; }
  [data-v=apl] .chip.on { border: 2px solid var(--focus); }
  [data-v=apl] .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 20px 24px; }
  [data-v=apl] .card { background: #fff; border-radius: 18px; padding: 10px 10px 14px; }
  [data-v=apl] .card .ph { aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; position: relative; }
  [data-v=apl] .card .heart { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 50%; background: var(--s3); backdrop-filter: blur(10px); display: grid; place-items: center; color: var(--ink); }
  [data-v=apl] .card .cap { padding: 10px 4px 0; }
  [data-v=apl] .card .cap b { font-size: 17px; font-weight: 600; display: block; }
  [data-v=apl] .card .cap small { display: block; color: var(--mute); font-size: 14px; letter-spacing: -0.224px; line-height: 1.43; }
  [data-v=apl] .card .cap a { color: var(--primary); font-size: 14px; letter-spacing: -0.224px; margin-top: 6px; display: inline-block; text-decoration: none; }
  /* 대화방 */
  [data-v=apl] .chdr { display: flex; align-items: center; gap: 10px; padding: 0 12px 10px; background: var(--tabBg); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  [data-v=apl] .iconbtn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--primary); }
  [data-v=apl] .av { width: 36px; height: 36px; border-radius: 9999px; overflow: hidden; }
  [data-v=apl] .msgs { padding: 16px 16px; display: grid; gap: 4px; }
  [data-v=apl] .day { justify-self: center; font-size: 12px; color: var(--mute2); margin: 8px 0; letter-spacing: -0.12px; }
  [data-v=apl] .bub { max-width: 75%; padding: 9px 14px; border-radius: 18px; font-size: 17px; line-height: 1.3; }
  [data-v=apl] .bub.them { background: #e9e9eb; color: var(--ink); justify-self: start; }
  [data-v=apl] .bub.me { background: var(--primary); color: #fff; justify-self: end; }
  [data-v=apl] .bub.me + .bub.me { border-top-right-radius: 6px; }
  [data-v=apl] .inbar { position: absolute; left: 0; right: 0; bottom: var(--tabH); padding: 8px 12px; background: var(--tabBg); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  [data-v=apl] .inbar .in { flex: 1; height: 44px; border-radius: 9999px; border: 1px solid var(--line); background: #fff; color: var(--mute2); padding: 0 16px; display: flex; align-items: center; font-size: 17px; }
  [data-v=apl] .inbar .send { width: 36px; height: 36px; border-radius: 9999px; background: var(--primary); color: #fff; display: grid; place-items: center; }
  /* 포인트·설정 (iOS 그룹 리스트) */
  [data-v=apl] .page { padding: 4px 20px 24px; display: grid; gap: 24px; }
  [data-v=apl] .feature { background: #fff; border-radius: 18px; padding: 24px; }
  [data-v=apl] .feature .big { font-size: 40px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.1; }
  [data-v=apl] .feature .sub { color: var(--mute); font-size: 14px; margin-top: 8px; letter-spacing: -0.224px; }
  [data-v=apl] .h3 { font-size: 13px; font-weight: 400; color: var(--mute); text-transform: none; padding: 0 16px 6px; letter-spacing: -0.08px; }
  [data-v=apl] .group { background: #fff; border-radius: 18px; padding: 0 16px; }
  [data-v=apl] .lrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 52px; }
  [data-v=apl] .lrow:last-child { border-bottom: 0; }
  [data-v=apl] .lrow .t { flex: 1; } [data-v=apl] .lrow .t b { display: block; font-size: 17px; font-weight: 400; } [data-v=apl] .lrow .t small { color: var(--mute); font-size: 14px; letter-spacing: -0.224px; }
  [data-v=apl] .lrow .val { color: var(--mute); font-size: 17px; display: inline-flex; gap: 6px; align-items: center; }
