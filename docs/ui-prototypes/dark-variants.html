<style>
  /* ── 페이지 ─────────────────────────────────────────────── */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #08080a; color: #ddd; font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; font-size: 13px; color: #aaa; flex-wrap: wrap; }
  .bar a, .bar button { color: #eee; background: #1c1c20; border: 1px solid #333; border-radius: 999px; padding: 4px 10px; text-decoration: none; font: inherit; cursor: pointer; }
  .bar a.on { background: #eee; color: #111; }
  .bar input[type=range] { width: 160px; }
  .frames { display: flex; gap: 20px; padding: 0 16px 32px; overflow-x: auto; align-items: flex-start; }
  .col { flex: 0 0 375px; }
  .col h2 { font-size: 15px; margin: 0 0 4px; color: #fff; }
  .col p.desc { font-size: 12px; color: #999; margin: 0 0 10px; height: 32px; line-height: 16px; }

  /* ── 폰 프레임 (앱 토큰은 전부 CSS 변수) ───────────────── */
  .frame { width: 375px; height: 812px; border-radius: 40px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 24px; border: 1px solid #222; }
  .scroll { position: absolute; inset: 0 0 72px 0; overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  /* 헤더 */
  .hdr { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 50px 16px 10px;
    background: var(--s1); border-bottom: 1px solid var(--hair); }
  .wordmark { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--primary); margin-right: auto; }
  .seg { position: relative; display: flex; background: var(--s2); border-radius: 999px; padding: 3px; width: 128px; }
  .seg i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 999px; background: var(--s3); box-shadow: var(--e1); }
  .seg b { flex: 1; text-align: center; font-size: 13px; font-weight: 600; z-index: 1; line-height: 26px; color: var(--muted); }
  .seg b.on { color: var(--textStrong); }
  .icb { width: 36px; height: 36px; border-radius: 999px; background: var(--s2); display: grid; place-items: center; position: relative; }
  .icb .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 99px; background: var(--primary); border: 2px solid var(--s2); }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1; }
  .pill.point { background: var(--pointSoft); color: var(--pointText); }
  .pill.primary { background: var(--primarySoft); color: var(--onPrimarySoft); }
  .pill.accent { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .pill.neutral { background: var(--s2); color: var(--muted); }
  .pill.onPhoto { background: rgba(0,0,0,.38); color: #fff; backdrop-filter: blur(6px); }
  .pill.online { background: rgba(0,0,0,.38); color: #fff; padding-left: 7px; }
  .pill.online::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--online); box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
  .pill.unread { background: var(--primaryFill); color: var(--onPrimary); min-width: 20px; justify-content: center; height: 20px; padding: 0 6px; }
  .avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--s3); position: relative; }
  .avatar.lg { width: 48px; height: 48px; }
  .avatar .v { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 99px; background: var(--verified); border: 2px solid var(--s1); }
  .avatar .on { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 99px; background: var(--online); border: 2px solid var(--s1); }

  /* 섹션 */
  .sec { padding: 14px 16px 4px; }
  .sec h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .6px; font-weight: 700; color: var(--faint); text-transform: uppercase; }

  /* 추천 카드 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { border-radius: 18px; overflow: hidden; background: var(--s1); border: 1px solid var(--hair); box-shadow: var(--e1); }
  .photo { aspect-ratio: 3/4; position: relative; background: var(--ph); }
  .photo .scrim { position: absolute; inset: auto 0 0 0; height: 62%; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.78) 100%); }
  .photo .tl { position: absolute; top: 10px; left: 10px; }
  .photo .info { position: absolute; left: 12px; right: 12px; bottom: 12px; color: #fff; }
  .photo .name { font-weight: 700; font-size: 17px; line-height: 22px; display: flex; align-items: center; gap: 4px; }
  .photo .name span { font-weight: 500; opacity: .85; font-size: 15px; }
  .photo .name .vv { width: 14px; height: 14px; border-radius: 99px; background: var(--verified); display: inline-grid; place-items: center; }
  .photo .meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }

  .row .t small { display: block; color: var(--muted); font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .r { text-align: right; display: grid; gap: 4px; justify-items: end; }
  .row .r time { color: var(--faint); font-size: 11px; }
  .chat { padding: 4px 0; display: grid; gap: 4px; }

  .bub.me + .bub.me { border-top-right-radius: 6px; margin-top: -2px; }
  .inbar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: var(--s1); border-top: 1px solid var(--hair); border-radius: 0; margin: 10px -16px 0; }
  .inbar .in { flex: 1; height: 40px; border-radius: 999px; background: var(--s2); color: var(--faint); padding: 0 14px; line-height: 40px; font-size: 15px; }
  .inbar .send { width: 36px; height: 36px; border-radius: 999px; background: var(--primaryFill); color: var(--onPrimary); display: grid; place-items: center; }

  .hero small { font-size: 13px; opacity: .9; }
  .hero .big { font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.5px; margin: 2px 0 8px; }
  .hero .pills { display: flex; gap: 6px; }
  .group { margin-top: 10px; border-radius: 16px; background: var(--s1); border: 1px solid var(--hair); box-shadow: var(--e1); padding: 0 14px; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .lrow:last-child { border-bottom: 0; }
  .lrow .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--s2); display: grid; place-items: center; color: var(--primary); }
  .lrow .t { flex: 1; } .lrow .t b { display: block; font-size: 15px; font-weight: 600; color: var(--textStrong); } .lrow .t small { color: var(--muted); font-size: 13px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .btn.sm { height: 30px; padding: 0 12px; font-size: 13px; }
  .btn.primary { background: var(--primaryFill); color: var(--onPrimary); }
  .btn.grad { background: var(--gradPrimary); color: var(--onPrimary); box-shadow: var(--e2); }
  .btn.secondary { background: var(--s2); color: var(--textStrong); }
  .btn.ghost { color: var(--text); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.dis { opacity: .45; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn.press { transform: scale(var(--press, 1)); }

  /* 텍스트 사다리 */
  .ladder { background: var(--s1); border: 1px solid var(--hair); border-radius: 16px; padding: 10px 14px; }
  .ladder div { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
  .ladder code { font-size: 11px; color: var(--faint); font-family: ui-monospace, monospace; }
  .ladder code.ok { color: var(--online); } .ladder code.bad { color: var(--danger); }

  /* 스켈레톤 */
  .sk { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--s2) 25%, var(--s3) 50%, var(--s2) 75%); background-size: 300% 100%; background-position: var(--shim, 100%) 0; }

  /* 탭바 */
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: var(--s1); border-top: 1px solid var(--hair); display: flex; padding: 6px 0 14px; }
  .tab { flex: 1; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); position: relative; }
  .tab .ico { width: 48px; height: 28px; border-radius: 999px; display: grid; place-items: center; position: relative; }
  .tab.on { color: var(--primary); }
  .tab.on .ico { background: var(--primarySoft); }
  .tab .badge { position: absolute; top: -2px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--primaryFill); color: var(--onPrimary); font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rb svg, .send svg, .icb svg { width: 16px; height: 16px; }
  .tab svg { width: 22px; height: 22px; }
  .rb.like svg { fill: currentColor; }
</style>

/* ── WCAG 대비 (앱의 contrast.test.ts 와 같은 수식) ─────────────── */
function parse(c) {
  if (c.startsWith('#')) { const h = c.length === 4 ? c.slice(1).split('').map(x => x + x).join('') : c.slice(1); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16), 1]; }
  const m = c.match(/rgba?\(([^)]+)\)/); const [r,g,b,a=1] = m[1].split(',').map(Number); return [r,g,b,a];
}
function over(fg, bg) { const [r,g,b,a] = parse(fg), [R,G,B] = parse(bg); return [r*a+R*(1-a), g*a+G*(1-a), b*a+B*(1-a)]; }
function lum([r,g,b]) { const f = v => { v /= 255; return v <= 0.03928 ? v/12.92 : ((v+0.055)/1.055) ** 2.4; }; return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); }
function ratio(fg, bg) { const a = lum(over(fg,bg)), b = lum(parse(bg).slice(0,3)); return (Math.max(a,b)+0.05)/(Math.min(a,b)+0.05); }
const cr = (fg, bg, min) => { const r = ratio(fg, bg); return `<code class="${r >= min ? 'ok' : 'bad'}">${r.toFixed(2)}:1</code>`; };

  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 22s7-7 7-12a7 7 0 1 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  gem: '<svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/></svg>',
};

/* ── 프레임 한 장 ────────────────────────────────────────────── */
function frame(key, scheme) {
  const v = VARIANTS[key], t = v[scheme];
  const vars = Object.entries(t).map(([k, val]) => `--${k}:${val}`).join(';');
  const ph1 = 'radial-gradient(120% 90% at 30% 20%, #6b4b7a 0%, #2e2340 45%, #141020 100%)';
  const ph2 = 'radial-gradient(110% 100% at 70% 30%, #c98a5a 0%, #6a4a3a 50%, #221612 100%)';
  const card = (ph, name, age, meta, online) => `
    <div class="card"><div class="photo" style="--ph:${ph}">
      <div class="scrim"></div>
      ${online ? '<span class="pill online tl">접속 중</span>' : ''}
      <div class="info">
        <div class="name">${name} <span>${age}</span><i class="vv">${I.check}</i></div>
        <div class="meta">${meta.map(m => `<span class="pill onPhoto">${m}</span>`).join('')}</div>
      </div>
      <div class="acts"><span class="rb">${I.send}</span><span class="rb like">${I.heart}</span></div>
    </div></div>`;
  return `
  <div class="col">
    <h2>${v.name}</h2><p class="desc">${v.desc}</p>
    <div class="frame" style="${vars}" data-variant="${key}">
      <div class="scroll">
        <div class="hdr">
          <span class="wordmark">meesae</span>
          <span class="seg"><i class="segi"></i><b class="on">추천</b><b>대화</b></span>
          <span class="icb">${I.filter}<i class="dot"></i></span>
          <span class="pill point">${I.gem}100P</span>
          <span class="avatar"><i class="v"></i></span>
        </div>

        <div class="sec"><h3>추천 · 2열 + 스크림</h3>
          <div class="grid">
            ${card(ph1, '하늘', 22, ['성북구', '디자이너', 'ENFP'], true)}
            ${card(ph2, '도윤', 25, ['송파구', '학생', 'ENTP'], false)}
          </div>
        </div>

        <div class="sec"><h3>대화 목록 · 대화방</h3>
          <div class="row"><span class="avatar lg"><i class="on"></i></span><div class="t"><b>하늘 <span class="pill primary">매치</span></b><small>반가워요! 안드로이드에서 잘 보이나요?</small></div><div class="r"><time>방금</time><span class="pill unread">3</span></div></div>
          <div class="row"><span class="avatar lg"></span><div class="t"><b>서윤 <span class="pill neutral">종료</span></b><small>주말에 한강 러닝 같이 하실 분?</small></div><div class="r"><time>어제</time></div></div>
          <div class="chat">
            <span class="pill neutral day">오늘</span>
            <div class="bub them">반가워요! 안드로이드에서 잘 보이나요?</div>
            <div class="bub me">네, 다크모드가 훨씬 보기 편하네요</div>
            <div class="bub me">주말에 성수동 어때요?</div>
          </div>
          <div class="inbar"><span class="in">메시지 보내기</span><span class="send">${I.up}</span></div>
        </div>

        <div class="sec"><h3>포인트</h3>
          <div class="hero"><small>내 포인트</small><div class="big">100P</div>
            <div class="pills"><span class="pill onPhoto">무료 첫 대화 9회</span><span class="pill onPhoto">오늘 좋아요 2회</span></div></div>
          <div class="group">
            <div class="lrow"><span class="ic">${I.cal}</span><div class="t"><b>출석 체크</b><small>하루 한 번 +10P</small></div><span class="btn sm primary">받기</span></div>
            <div class="lrow"><span class="ic">${I.pin}</span><div class="t"><b>위치 인증</b><small>하루 한 번 +5P</small></div><span class="btn sm secondary">인증</span></div>
            <div class="lrow"><span class="ic">${I.bolt}</span><div class="t"><b>부스트</b><small>30분 동안 맨 위에 보여요</small></div><span class="pill point">100P</span></div>
          </div>
        </div>

        <div class="sec"><h3>버튼 · 눌림 · 비활성</h3>
          <div class="btns">
            <span class="btn primary press">좋아요</span><span class="btn grad">대화 시작</span>
            <span class="btn secondary">대화</span><span class="btn ghost">건너뛰기</span>
            <span class="btn danger">차단</span><span class="btn primary dis">보내기</span>
          </div>
          <div class="btns" style="margin-top:10px">
            <span class="pill primary">선택됨</span><span class="pill accent">같은 나라</span><span class="pill neutral">ENFP</span>
          </div>
          <div style="display:grid;gap:8px;margin-top:12px"><span class="sk" style="width:70%"></span><span class="sk" style="width:45%"></span></div>
        </div>

        <div class="sec"><h3>텍스트 4단계 · 대비 (표면 위)</h3>
          <div class="ladder">
            <div><span style="color:var(--textStrong);font-weight:700">textStrong 제목 Aa</span>${cr(t.textStrong, t.s1, 4.5)}</div>
            <div><span style="color:var(--text)">text 본문 Aa</span>${cr(t.text, t.s1, 4.5)}</div>
            <div><span style="color:var(--muted);font-size:14px">textMuted 보조 Aa</span>${cr(t.muted, t.s1, 4.5)}</div>
            <div><span style="color:var(--faint);font-size:12px">textFaint 힌트 Aa (UI 3:1)</span>${cr(t.faint, t.s1, 3)}</div>
            <div><span style="background:var(--primaryFill);color:var(--onPrimary);padding:2px 10px;border-radius:99px;font-size:14px;font-weight:600">onPrimary / primaryFill</span>${cr(t.onPrimary, t.primaryFill, 4.5)}</div>
            <div><span style="color:var(--primary);font-weight:600">primary 강조 (UI 3:1)</span>${cr(t.primary, t.bg, 3)}</div>
            <div><span style="background:var(--pointSoft);color:var(--pointText);padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600">pointText / pointSoft</span>${cr(t.pointText, t.pointSoft, 4.5)}</div>
            <div><span style="background:var(--primarySoft);color:var(--onPrimarySoft);padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600">onPrimarySoft / primarySoft</span>${cr(t.onPrimarySoft, t.primarySoft, 4.5)}</div>
          </div>
          <div style="height:24px"></div>
        </div>
      </div>

      <div class="tabbar">
        <div class="tab on"><span class="ico">${I.chat}<span class="badge">3</span></span>대화</div>
        <div class="tab"><span class="ico">${I.map}</span>지도</div>
        <div class="tab"><span class="ico">${I.news}</span>피드</div>
      </div>
    </div>
  </div>`;
}

/* ── URL 쿼리 · 렌더 ─────────────────────────────────────────── */
const q = new URLSearchParams(location.search);
const want = q.get('variant') || 'all';
const scheme = q.get('scheme') === 'light' ? 'light' : 'dark';
const keys = want === 'all' ? Object.keys(VARIANTS) : want.split(',').filter(k => VARIANTS[k]);
document.getElementById('frames').innerHTML = keys.map(k => frame(k, scheme)).join('');
document.querySelectorAll('.bar a').forEach(a => {
  const u = new URL(a.href); u.searchParams.set('variant', a.dataset.v ?? want); u.searchParams.set('scheme', a.dataset.s ?? scheme);
  if (q.get('hold')) u.searchParams.set('hold', q.get('hold'));
  a.href = u.search; a.classList.toggle('on', a.dataset.v === want || a.dataset.s === scheme);
});

/* ── 시계는 하나. progress 0→1 이 모든 움직임을 정한다 (card-fx 방식) ── */
const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const ease = x => x < .5 ? 2*x*x : 1 - (-2*x + 2) ** 2 / 2;
function render(p) {
  document.documentElement.style.setProperty('--press', 1 - 0.04 * Math.sin(Math.PI * seg(p, 0, .35)));
  const tabX = ease(seg(p, .2, .45)) - ease(seg(p, .7, .95));          // 추천 → 대화 → 추천
  document.querySelectorAll('.segi').forEach(el => el.style.transform = `translateX(${tabX * 100}%)`);
  document.querySelectorAll('.seg b').forEach((b, i) => b.classList.toggle('on', (i % 2 === 1) === (tabX > .5)));
  document.documentElement.style.setProperty('--shim', `${100 - p * 200}%`);
  const pop = 1 + 0.25 * Math.sin(Math.PI * seg(p, .5, .62));          // 좋아요 하트 팝
  document.querySelectorAll('.rb.like').forEach(el => el.style.transform = `scale(${pop})`);
  document.getElementById('pv').textContent = p.toFixed(2);
  document.getElementById('hold').value = p;
}
const DUR = 2400; let playing = !q.get('hold'); let t0 = performance.now(); let held = Number(q.get('hold') || 0);
function loop(now) { if (playing) { const p = ((now - t0) % DUR) / DUR; held = p; render(p); } requestAnimationFrame(loop); }
render(held); requestAnimationFrame(loop);
document.getElementById('hold').addEventListener('input', e => { playing = false; held = Number(e.target.value); render(held); });
document.getElementById('play').addEventListener('click', () => { playing = !playing; t0 = performance.now() - held * DUR; });
window.__proto = { render, set hold(v) { playing = false; held = v; render(v); } };
</script>
</body>
</html>
